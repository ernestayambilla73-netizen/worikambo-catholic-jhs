<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Money Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">STUDENT FINANCE</p>
        <h1>School Money Tracker</h1>
        <p class="subtitle">Keep track of every amount you receive while at school.</p>
      </div>
      <div class="hero-actions"><a class="nav-btn" href="records.html">📋 Records</a><div class="wallet">💰</div></div>
    </header>

    <main>
      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Add Money Received</h2>
            <p>Record money sent to you by parents, guardians, relatives, or anyone else.</p>
          </div>
        </div>

        <form id="moneyForm">
          <div class="form-grid">
            <label>
              Amount (GH₵)
              <input id="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 150" required>
            </label>

            <label>
              Sent By
              <input id="sender" type="text" placeholder="e.g. Mum" required>
            </label>

            <label>
              Date
              <input id="date" type="date" required>
            </label>

            <label>
              Purpose
              <select id="purpose">
                <option>Food</option>
                <option>School fees</option>
                <option>Transport</option>
                <option>Books & supplies</option>
                <option>Accommodation</option>
                <option>Personal expenses</option>
                <option>Other</option>
              </select>
            </label>

            <label class="full">
              Note
              <input id="note" type="text" placeholder="Optional note">
            </label>
          </div>
          <button type="submit" class="add-btn">+ Add Money</button>
        </form>
      </section>


    </main>

    <footer>School Money Tracker • Your records stay in this browser</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
