<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Worikambo R/C JHS</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>Worikambo <small>ADMIN</small></span></a><nav><a href="index.html">Website</a><a href="portal.html">Portal</a><a href="#" id="logout">Logout</a></nav></header>
<main><section class="page-hero"><span class="eyebrow">ADMINISTRATION</span><h1>School Management Dashboard</h1><p>Manage students, graduation status, resources, leaders and Hall of Fame records.</p></section>
<section class="section"><div id="status" class="message"></div><div class="admin-grid">
<article class="login-card"><h3>Add Student</h3><input id="sid" placeholder="Student ID"><input id="name" placeholder="Full name"><input id="email" placeholder="Email"><input id="pw" placeholder="Temporary password"><input id="year" placeholder="Admission year"><button class="btn primary full" id="addStudent">Create student</button></article>
<article class="login-card"><h3>Add Former Headteacher / Admin</h3><input id="lname" placeholder="Full name"><input id="ltitle" placeholder="Title / position"><input id="lyears" placeholder="Years served"><textarea id="lach" placeholder="Achievements"></textarea><button class="btn primary full" id="addLeader">Save leader</button></article>
<article class="login-card"><h3>Add Resource</h3><input id="rtitle" placeholder="Resource title"><input id="rcat" placeholder="Category"><input id="rurl" placeholder="File/page URL"><input id="raccess" placeholder="student / public"><button class="btn primary full" id="addResource">Save resource</button></article>
</div><h2>Students</h2><div id="users" class="admin-list"></div></section></main>
<script>
const $=x=>document.querySelector(x); const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
async function load(){try{const me=await api('/api/auth/me');if(me.user?.role!=='admin'){location='portal.html';return}const users=await api('/api/admin/users');$('#users').innerHTML=users.map(u=>`<div class="leader-card"><b>${u.full_name}</b><p>${u.student_id} • ${u.account_status} • ${u.role}</p>${u.account_status!=='old_student'?`<button onclick="graduate(${u.id})" class="btn primary">Mark as Graduated</button>`:''}</div>`).join('')}catch(e){$('#status').textContent=e.message}}
window.graduate=async id=>{await api('/api/admin/users/'+id+'/graduate',{method:'PUT',body:JSON.stringify({graduation_year:new Date().getFullYear()})});load()};
$('#addStudent').onclick=async()=>{try{await api('/api/users',{method:'POST',body:JSON.stringify({student_id:$('#sid').value,full_name:$('#name').value,email:$('#email').value,password:$('#pw').value,admission_year:$('#year').value})});$('#status').textContent='Student created.';load()}catch(e){$('#status').textContent=e.message}};
$('#addLeader').onclick=async()=>{await api('/api/admin/leaders',{method:'POST',body:JSON.stringify({name:$('#lname').value,title:$('#ltitle').value,years_served:$('#lyears').value,achievements:$('#lach').value})});$('#status').textContent='Leader saved.'};
$('#addResource').onclick=async()=>{await api('/api/admin/resources',{method:'POST',body:JSON.stringify({title:$('#rtitle').value,category:$('#rcat').value,url:$('#rurl').value,access_level:$('#raccess').value||'student'})});$('#status').textContent='Resource saved.'};
$('#logout').onclick=async e=>{e.preventDefault();await api('/api/auth/logout',{method:'POST'});location='portal.html'};load();
</script></body></html>
